<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capital Critters</title>
<style>
  :root{
    /* Video window, seated in the crest's 16:9 opening (measured). */
    --win-left: 32.14%;
    --win-top: 39.91%;
    --win-width: 37.30%;
    --win-height: 31.20%;
  }
  body{margin:0;background:#f4efe3;display:flex;justify-content:center;padding:24px;}
  .cc-player{
    position:relative;
    width:min(880px,96vw);
    aspect-ratio:1264/843;
    background:url("https://anthonysmith104-ux.github.io/CC-Ep-1/crest_frame_wide.png") center/contain no-repeat;
  }
  .cc-player video{
    position:absolute;
    left:var(--win-left); top:var(--win-top);
    width:var(--win-width); height:var(--win-height);
    object-fit:cover;
    background:#0d1526;
    z-index:1;
  }
  .cc-player .tap{
    position:absolute;left:var(--win-left);top:var(--win-top);
    width:var(--win-width);height:var(--win-height);
    z-index:2;cursor:pointer;background:transparent;border:0;
  }
  .adjust .cc-player video{outline:4px solid magenta;}
</style>
</head>
<body>
  <div class="cc-player">
    <video id="v" autoplay muted loop playsinline
           src="https://anthonysmith104-ux.github.io/CC-Ep-1/CapitalCritters_Ep1_Reel_Landscape_Intro.mp4"></video>
    <button class="tap" id="tap" aria-label="Unmute"></button>
  </div>
<script>
  if(location.search.includes('adjust')) document.body.classList.add('adjust');
  var v=document.getElementById('v'), tap=document.getElementById('tap');
  tap.addEventListener('click',function(){ v.muted=!v.muted; if(!v.muted) v.play(); });
</script>
</body>
</html>
