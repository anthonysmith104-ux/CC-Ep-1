<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capital Critters — Crest Player</title>
<style>
  :root{
    /* ── ADJUST THESE FOUR to seat the video in the square opening ──
       % of the frame. Add ?adjust to the URL to see a magenta outline,
       nudge these, save, refresh until it sits just inside the border. */
    --win-left: 37%;
    --win-top: 33%;
    --win-width: 32%;
    --win-height: 30%;
  }
  body{margin:0;background:#f4efe3;display:flex;justify-content:center;padding:24px;}

  /* The crest frame is the BACKGROUND of the container. */
  .cc-player{
    position:relative;
    width:min(780px,96vw);
    aspect-ratio:1535/1024;                 /* matches the crest_frame.png */
    background:url("crest_frame.png") center/contain no-repeat;
  }
  /* The video sits ON TOP of the frame, positioned inside the opening. */
  .cc-player video{
    position:absolute;
    left:var(--win-left); top:var(--win-top);
    width:var(--win-width); height:var(--win-height);
    object-fit:cover;
    clip-path: inset(0 round 6px);          /* square, softly rounded */
    background:#0d1526;
    z-index:1;
  }
  .cc-player .tap{
    position:absolute;
    left:var(--win-left); top:var(--win-top);
    width:var(--win-width); height:var(--win-height);
    z-index:2;cursor:pointer;background:transparent;border:0;
  }
  .adjust .cc-player video{outline:4px solid magenta;}
</style>
</head>
<body>
  <div class="cc-player">
    <video id="v" autoplay muted loop playsinline
           src="https://anthonysmith104-ux.github.io/CC-Ep-1/CapitalCritters_Ep1_Reel_Vertical_Intro.mp4"></video>
    <button class="tap" id="tap" aria-label="Unmute"></button>
  </div>
<script>
  if(location.search.includes('adjust')) document.body.classList.add('adjust');
  var v=document.getElementById('v'), tap=document.getElementById('tap');
  tap.addEventListener('click',function(){ v.muted=!v.muted; if(!v.muted) v.play(); });
</script>
</body>
</html>
