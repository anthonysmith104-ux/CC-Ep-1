<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Capital Critters — Crest Player v2</title>
<style>
  :root{
    --win-left: 37%;
    --win-top: 33%;
    --win-width: 32%;
    --win-height: 30%;
  }
  body{margin:0;background:#f4efe3;display:flex;flex-direction:column;align-items:center;padding:16px;font-family:Arial,sans-serif;}
  #status{font-size:13px;color:#333;background:#fff;border:1px solid #ccc;padding:8px 12px;border-radius:6px;margin-bottom:12px;max-width:760px;}
  .cc-player{
    position:relative;
    width:min(780px,96vw);
    aspect-ratio:1535/1024;
    background:url("https://anthonysmith104-ux.github.io/CC-Ep-1/crest_frame.png") center/contain no-repeat;
    outline:1px dashed #bbb;
  }
  .cc-player video{
    position:absolute;
    left:var(--win-left); top:var(--win-top);
    width:var(--win-width); height:var(--win-height);
    object-fit:cover;
    background:#0d1526;
    z-index:1;
    outline:4px solid magenta;   /* always on in v2 so you can SEE the window */
  }
  .cc-player .tap{
    position:absolute;left:var(--win-left);top:var(--win-top);
    width:var(--win-width);height:var(--win-height);
    z-index:2;cursor:pointer;background:transparent;border:0;
  }
</style>
</head>
<body>
  <div id="status">Loading… (this line will report what the video does)</div>
  <div class="cc-player">
    <video id="v" autoplay muted loop playsinline
           src="https://anthonysmith104-ux.github.io/CC-Ep-1/CapitalCritters_Ep1_Reel_Vertical_Intro.mp4"></video>
    <button class="tap" id="tap" aria-label="Unmute"></button>
  </div>
<script>
  var v=document.getElementById('v'), s=document.getElementById('status'), tap=document.getElementById('tap');
  function say(m){ s.textContent = m; }
  v.addEventListener('loadedmetadata', function(){ say('✅ Video loaded: '+v.videoWidth+'×'+v.videoHeight+'. The magenta box marks the video — drag the --win values to seat it.'); });
  v.addEventListener('playing', function(){ say('▶️ Video is PLAYING inside the magenta box. Adjust --win-left/top/width/height to fit the opening.'); });
  v.addEventListener('error', function(){ say('❌ Video ERROR — the file did not load. Check the URL.'); });
  setTimeout(function(){ if(v.readyState<2) say('⚠️ Video still not ready after 5s — likely a caching or network issue. Try a hard refresh (Ctrl+Shift+R).'); }, 5000);
  tap.addEventListener('click',function(){ v.muted=!v.muted; if(!v.muted) v.play(); });
</script>
</body>
</html>
